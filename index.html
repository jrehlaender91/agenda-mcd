<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Agenda · Medios y Cultura Digital</title>
  <meta name="description" content="Charlas, talleres, proyecciones y convocatorias del Departamento de Medios y Cultura Digital.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Medios y Cultura Digital">
  <meta property="og:title" content="Agenda · Medios y Cultura Digital">
  <meta property="og:description" content="Charlas, talleres, proyecciones y fechas del semestre para LC y LTM.">
  <meta property="og:url" content="https://jrehlaender91.github.io/agenda-mcd/">
  <meta property="og:image" content="https://jrehlaender91.github.io/agenda-mcd/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="es_MX">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232438e8'/%3E%3Ctext x='16' y='23' font-family='Arial' font-weight='700' font-size='19' text-anchor='middle' fill='white'%3EA%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="masthead">
    <div class="wrap">
      <p class="dept">Departamento de Medios y Cultura Digital</p>
      <h1>Agenda</h1>
      <div class="masthead-row">
        <p class="today" id="today"></p>
        <div class="masthead-tools">
          <div class="seg" id="career" role="group" aria-label="Filtrar por carrera">
            <button type="button" data-career="todas" aria-pressed="true">Todas</button>
            <button type="button" data-career="lc" aria-pressed="false">LC</button>
            <button type="button" data-career="ltm" aria-pressed="false">LTM</button>
          </div>
          <div class="seg" role="group" aria-label="Cambiar vista">
            <button type="button" id="view-list" aria-pressed="true">Lista</button>
            <button type="button" id="view-month" aria-pressed="false">Mes</button>
          </div>
          <button type="button" class="btn small" id="subscribe">Suscribirme al calendario</button>
        </div>
      </div>
    </div>
  </header>

  <div class="toolbar">
    <div class="wrap">
      <div class="chips" id="chips" role="group" aria-label="Filtrar por tipo de evento"></div>
    </div>
  </div>

  <main class="wrap" id="main" aria-live="polite">
    <p class="state">Cargando la agenda…</p>
  </main>

  <footer class="wrap foot">
    <span>Horarios en hora de Monterrey.</span>
    <a href="admin.html">Administrar</a>
  </footer>

  <dialog id="detail" aria-labelledby="detail-title"></dialog>

  <script src="common.js"></script>
  <script src="app.js"></script>
</body>
</html>
